services:
  db:
    image: postgres:17
    container_name: sigpa_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sigpa_pgdata:/var/lib/postgresql/data

volumes:
  sigpa_pgdata: